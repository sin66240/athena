[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "athena-ai"
version = "0.5.0"
description = "Modular AI Poker Framework"
authors = [
    {name = "sin66240"}
]
requires-python = ">=3.10"


dependencies = [
    "numpy",
    "pandas",
    "scikit-learn"
]


[tool.pytest.ini_options]
testpaths = [
    "tests"
]
pythonpath = ["."]
